name: Render

# Renders the site from the metadata releases and deploys it. This is the half
# of the pipeline that depends on the design: the template, the logo, the
# landing page, docfx-build.json and the scripts under build/ that run after
# metadata. The half that depends on the game is metadata.yml. This workflow
# does not download packages or run `docfx metadata`; it takes whatever the
# meta/<id> releases hold.
#
# Every version whose release exists is a candidate. Whether one is actually
# rebuilt is decided by the fingerprint recorded on the host against the one
# build/fingerprint.sh computes from this checkout and the release manifest:
# meta= (which archive), docs= and build= (which design and tooling), docfx=
# (which renderer). A push that changes the template therefore re-renders every
# version, while a push that leaves those inputs alone skips them all.
#
# Versions published before this split recorded a pkgs= fingerprint; they
# compare unequal once and are rebuilt once.
#
# Version ids: the matrix and the release tags use the canonical id, v1.5.1 for
# the release build and e1.5.1 for early access, because the two are different
# games with overlapping numbers. The docs host, versions.json and the page
# titles predate the prefix and know the release build as plain 1.5.1; that
# spelling (the site id) is derived once, in the "Resolve game version" step,
# and is the only one that crosses to the host.

on:
  push:
    branches: [ dev ]
    paths:
      - '.github/workflows/render.yml'
      - 'build/**'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      versions:
        description: 'Game versions to render, space separated (1.5.1 e1.5.2). Empty: every version that has a metadata release.'
        required: false
        type: string
      force:
        description: 'Rebuild even if nothing has changed since the last deploy'
        required: false
        type: boolean
        default: false
      set-latest:
        description: 'Publish as /latest even when this is not the stable version (needs exactly one version)'
        required: false
        type: boolean
        default: false
      max-parallel:
        description: 'Versions rendered at the same time'
        required: false
        type: number
        default: 6

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  SITE_ORIGIN: https://bannerlordapi.butr.link
  DOCS_PORT: ${{ vars.DOCS_PORT || 22 }}
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}

jobs:
  plan:
    name: Choose versions
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.pick.outputs.versions }}
      single: ${{ steps.pick.outputs.single }}
    steps:
    - name: Pick the versions
      id: pick
      # An explicit list, or every meta/<id> release. Release builds first,
      # then early access, each newest first, so a partial run reaches the
      # versions people read most before the archive.
      run: |
        # Canonical id, vX.Y.Z or eX.Y.Z; a bare number is the release build.
        norm() {
          v="$1"
          case "$v" in
            "") return 1 ;;
            v[0-9]*|e[0-9]*) ;;
            [0-9]*) v="v$v" ;;
            *) echo "::error::Version '$v' must be vX.Y.Z (release), eX.Y.Z (early access) or X.Y.Z" >&2; exit 1 ;;
          esac
          case "${v#?}" in
            *[!0-9._-]*) echo "::error::Version '$v' may only contain digits . _ - after the prefix" >&2; exit 1 ;;
          esac
          echo "$v"
        }
        list=
        if [ -n "${{ inputs.versions }}" ]; then
          for v in ${{ inputs.versions }}; do list="$list $(norm "$v")"; done
        else
          tags=$(gh release list --limit 500 --json tagName -q '.[].tagName' | sed -n 's|^meta/||p')
          release=$(printf '%s\n' "$tags" | grep '^v[0-9]' | sort -V | tac || true)
          early=$(printf '%s\n' "$tags" | grep '^e[0-9]' | sort -V | tac || true)
          list=$(printf '%s\n%s\n' "$release" "$early" | sed '/^$/d' | tr '\n' ' ')
        fi
        [ -n "$(echo $list)" ] || { echo "::error::No versions to render; has the Metadata workflow published any release?"; exit 1; }
        json=$(printf '%s\n' $list | jq -R . | jq -sc .)
        echo "versions=$json" >> "$GITHUB_OUTPUT"
        [ "$(echo $list | wc -w)" = "1" ] && echo "single=true" >> "$GITHUB_OUTPUT" || echo "single=false" >> "$GITHUB_OUTPUT"
        echo "rendering: $list"
      shell: bash

  render:
    name: Render ${{ matrix.version }}
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # A `number` input reaches the strategy block as a string, and is empty on
      # push; fromJSON turns both into a number.
      max-parallel: ${{ fromJSON(inputs.max-parallel || 6) }}
      matrix:
        version: ${{ fromJson(needs.plan.outputs.versions) }}
    concurrency:
      # Per version. A constant group would serialise the matrix and, worse,
      # cancel it: GitHub keeps only one run pending per group. Different
      # versions write to different /v/<version>/ trees, so they do not conflict.
      group: docfx-deploy-${{ matrix.version }}
      cancel-in-progress: false
    steps:
    - name: DocFX Setup
      uses: butr/actions-docfx-setup@v4
      with:
        github-token: ${{secrets.GITHUB_TOKEN}}

    - name: Resolve game version
      id: ver
      # The one place the canonical id (v1.5.2 / e1.5.2) is translated into what
      # the host uses. `version` names the release and the matrix; `site` is the
      # id for get-state/set-state/publish, version.txt and versions.json (1.5.2 /
      # e1.5.2); `path` is the tree the pages are uploaded to (v/1.5.2 / e/1.5.2).
      run: |
        v="${{ matrix.version }}"
        case "$v" in
          v[0-9]*) site="${v#v}"; p="v/${v#v}" ;;
          e[0-9]*) site="$v";     p="e/${v#e}" ;;
          *) echo "::error::'$v' is not a canonical version id (vX.Y.Z or eX.Y.Z)"; exit 1 ;;
        esac
        echo "version=$v" >> "$GITHUB_OUTPUT"
        echo "site=$site" >> "$GITHUB_OUTPUT"
        echo "path=$p" >> "$GITHUB_OUTPUT"
        echo "release: $v   host id: $site   site path: /$p/"
        # /latest is defined as the stable channel, so the publish step keys off
        # this rather than off a default-on input. A manually dispatched old version
        # then cannot repoint the whole site by accident. The channel variable is
        # a release build spelled with or without the v.
        st="${{ vars.GAME_VERSION_STABLE }}"; st="v${st#v}"
        [ "$v" = "$st" ] && echo "is-stable=true" >> "$GITHUB_OUTPUT" || echo "is-stable=false" >> "$GITHUB_OUTPUT"
        echo "stable channel: ${st:-unset}"
      shell: bash

    - name: Check deploy configuration
      env:
        DOCS_SSH_KEY: ${{ secrets.DOCS_SSH_KEY }}
      run: |
        miss=
        [ -n "${{ vars.DOCS_HOST }}" ] || miss="$miss DOCS_HOST"
        [ -n "${{ vars.DOCS_USER }}" ] || miss="$miss DOCS_USER"
        [ -n "$DOCS_SSH_KEY" ] || miss="$miss DOCS_SSH_KEY"
        [ -n "${{ vars.DOCS_KNOWN_HOSTS }}" ] || miss="$miss DOCS_KNOWN_HOSTS"
        if [ -n "$miss" ]; then
          echo "::error::Missing deploy configuration:$miss"
          exit 1
        fi
        echo "deploy target: ${{ vars.DOCS_USER }}@${{ vars.DOCS_HOST }} (port $DOCS_PORT)"
      shell: bash

    - name: Configure SSH
      # The host key is pinned from a variable. ssh-keyscan at run time would be
      # trust-on-first-use on every run, which authenticates nothing.
      env:
        DOCS_SSH_KEY: ${{ secrets.DOCS_SSH_KEY }}
        DOCS_KNOWN_HOSTS: ${{ vars.DOCS_KNOWN_HOSTS }}
      run: |
        install -d -m 700 ~/.ssh
        printf '%s\n' "$DOCS_SSH_KEY" > ~/.ssh/id_ed25519
        chmod 600 ~/.ssh/id_ed25519
        printf '%s\n' "$DOCS_KNOWN_HOSTS" > ~/.ssh/known_hosts
        chmod 644 ~/.ssh/known_hosts
      shell: bash

    - name: Fetch the metadata release
      # The manifest names the archive; downloading by that name rather than by
      # pattern is what makes a read during a metadata update consistent.
      run: |
        V="${{ steps.ver.outputs.version }}"
        mkdir -p meta
        gh release download "meta/$V" -p manifest.json -D meta \
          || { echo "::error::No metadata release meta/$V; run the Metadata workflow for it first"; exit 1; }
        archive=$(jq -r '.archive // empty' meta/manifest.json)
        [ -n "$archive" ] || { echo "::error::meta/$V manifest names no archive"; exit 1; }
        gh release download "meta/$V" -p "$archive" -D meta
        echo "manifest: pkgs=$(jq -r .pkgs meta/manifest.json) docfx=$(jq -r .docfx meta/manifest.json) created=$(jq -r .created meta/manifest.json)"
        tar --zstd -xf "meta/$archive" -C docs
        for f in api/toc.yml api-delta-summary.json version.json; do
          test -s "docs/$f" || { echo "::error::the archive holds no $f"; exit 1; }
        done
        # The archive must be the build the release claims to be: an early access
        # archive under a release tag (or the reverse) would publish the wrong
        # game under this path.
        got=$(jq -r '.id // empty' docs/version.json)
        [ "$got" = "$V" ] || { echo "::error::meta/$V holds an archive for '${got:-<no id>}'"; exit 1; }
        echo "sections: $(jq -r '[.sections[].dest] | join(" ")' docs/version.json)"
      shell: bash

    - name: Generate the design-side files
      # index.md and docfx-globals.json from version.json and the delta summary,
      # so the landing page follows the checkout, not the archive.
      run: |
        python3 build/generate-docfx-config.py render docs --site ${{ env.SITE_ORIGIN }}
        python3 build/apply-api-delta.py docs --fill-from docs/api-delta-summary.json
      shell: bash

    - name: Decide whether a rebuild is needed
      id: fp
      run: |
        V="${{ steps.ver.outputs.site }}"
        SSH="ssh -p $DOCS_PORT -i ~/.ssh/id_ed25519 ${{ vars.DOCS_USER }}@${{ vars.DOCS_HOST }}"
        fp=$(bash build/fingerprint.sh meta/manifest.json)
        printf '%s' "$fp" > fingerprint.txt
        echo "local  : $fp"
        if remote=$($SSH get-state "$V"); then
          echo "remote : ${remote:-<none>}"
        else
          echo "::warning::Could not read the remote state for $V; treating it as unpublished"
          remote=
        fi
        if [ "${{ inputs.force }}" = "true" ]; then
          echo "changed=true" >> "$GITHUB_OUTPUT"; echo "-> forced rebuild"
        elif [ "$remote" = "$fp" ]; then
          echo "changed=false" >> "$GITHUB_OUTPUT"
          echo "-> $V is already published from these exact inputs; skipping"
          echo "Skipped $V: already published from these inputs." >> "$GITHUB_STEP_SUMMARY"
        else
          echo "changed=true" >> "$GITHUB_OUTPUT"; echo "-> rendering"
        fi
      shell: bash

    - name: Run DocFX
      if: steps.fp.outputs.changed == 'true'
      run: docfx docs/docfx-build.json
      shell: bash

    - name: Write the API index for version comparison
      if: steps.fp.outputs.changed == 'true'
      # compare.html diffs two versions in the browser from the api-index.json
      # each version publishes next to its pages.
      run: python3 build/write-api-index.py docs ${{ steps.ver.outputs.site }}
      shell: bash

    - name: Post-process xrefmap
      if: steps.fp.outputs.changed == 'true'
      # baseUrl pins consumers to this exact game version, so a link from
      # ButterLib/MCM keeps resolving after newer versions are published.
      # The dropped fields are never used: Find() binary-searches on uid alone,
      # and fullName/nameWithType are only read for ?displayProperty=.
      run: >-
        sed -i -E
        -e '1a baseUrl: ${{ env.SITE_ORIGIN }}/${{ steps.ver.outputs.path }}/'
        -e '/^  (commentId|fullName|nameWithType): /d'
        docs/_site/xrefmap.yml
      shell: bash

    - name: Stamp version marker
      if: steps.fp.outputs.changed == 'true'
      # Lets anything read back which version /latest resolves to, by fetching
      # /version.txt from the site root. The delta summary and the metadata
      # manifest ship next to the pages, so what a version was rendered from can
      # be read off the site.
      run: |
        echo "${{ steps.ver.outputs.site }}" > docs/_site/version.txt
        cp docs/api-delta-summary.json docs/_site/api-delta-summary.json
        cp meta/manifest.json docs/_site/metadata.json
      shell: bash

    - name: Compress for gzip_static
      if: steps.fp.outputs.changed == 'true'
      # Text assets ship only as .gz; nginx serves them via `gzip_static always`.
      # index.html is the exception -- nginx's index module stats the real file,
      # so a plain copy has to stay for directory requests to resolve.
      # -n omits the filename and mtime from the gzip header, so identical
      # content produces identical bytes between builds.
      run: |
        cd docs/_site
        before=$(du -sb . | cut -f1)
        find . -type f \( -name '*.html' -o -name '*.css' -o -name '*.js' \
             -o -name '*.json' -o -name '*.yml' -o -name '*.svg' -o -name '*.map' \) \
          -print0 | xargs -0 -r -P "$(nproc)" -n 64 gzip -9nk
        find . -type f \( -name '*.html' -o -name '*.css' -o -name '*.js' \
             -o -name '*.json' -o -name '*.yml' -o -name '*.svg' -o -name '*.map' \) \
          ! -name 'index.html' -print0 | xargs -0 -r rm -f
        after=$(du -sb . | cut -f1)
        echo "payload $(numfmt --to=iec $before) -> $(numfmt --to=iec $after)"
        test -f index.html || { echo "::error::index.html was removed; directory requests would 404"; exit 1; }
      shell: bash

    - name: Deploy version
      if: steps.fp.outputs.changed == 'true'
      # Paths are relative because the deploy key is confined by rrsync, which
      # anchors every path to its own root. rrsync also allows one session at a
      # time per user; the wrapper script waits and retries when another job's
      # upload holds it.
      run: |
        bash build/rsync-retry.sh -a --delete \
          -e "ssh -p $DOCS_PORT -i ~/.ssh/id_ed25519" \
          docs/_site/ "${{ vars.DOCS_USER }}@${{ vars.DOCS_HOST }}:${{ steps.ver.outputs.path }}/"
      shell: bash

    - name: Record build fingerprint
      if: steps.fp.outputs.changed == 'true'
      # Written after the deploy, so a failed build never marks a version current.
      run: |
        V="${{ steps.ver.outputs.site }}"
        ssh -p "$DOCS_PORT" -i ~/.ssh/id_ed25519 \
          "${{ vars.DOCS_USER }}@${{ vars.DOCS_HOST }}" set-state "$V" < fingerprint.txt
      shell: bash

    - name: Publish as latest
      id: publish
      # set-latest is only defined for workflow_dispatch. On push it is an empty
      # string, which GitHub coerces to 0 -- the same as false -- so `!= false`
      # would silently skip publishing on exactly the trigger that matters most.
      # It is also only honoured with exactly one version: with several in the
      # matrix it would otherwise publish whichever finished last. Early access
      # builds are never /latest: the site root is the release line.
      if: >-
        steps.fp.outputs.changed == 'true' &&
        !startsWith(steps.ver.outputs.version, 'e') &&
        (steps.ver.outputs.is-stable == 'true' || (inputs.set-latest && needs.plan.outputs.single == 'true'))
      run: |
        V="${{ steps.ver.outputs.site }}"
        ssh -p "$DOCS_PORT" -i ~/.ssh/id_ed25519 \
          "${{ vars.DOCS_USER }}@${{ vars.DOCS_HOST }}" publish "$V"
        echo "published $V as latest"
      shell: bash

    - name: Update version manifest
      # The picker reads this at run time, which is what lets a version built
      # today appear in the dropdown of one built two years ago. Rebuilt from
      # server state on every deploy, so it is self-healing: a job that dies
      # before this step, or two parallel jobs racing on the upload, are
      # corrected by the next deploy.
      run: |
        SSH="ssh -p $DOCS_PORT -i ~/.ssh/id_ed25519 -o BatchMode=yes"
        SSH="$SSH -o ControlMaster=auto -o ControlPath=$HOME/.ssh/cm-%r@%h:%p -o ControlPersist=60"
        TARGET="${{ vars.DOCS_USER }}@${{ vars.DOCS_HOST }}"

        # Every version that has metadata, newest first: release builds, then
        # early access, as site ids (1.5.3, e1.9.0), which is what the picker
        # and the host's state verbs use. Published means the host has a
        # fingerprint for it.
        tags=$(gh release list --limit 500 --json tagName -q '.[].tagName' | sed -n 's|^meta/||p')
        candidates=$(printf '%s\n%s\n' "$(printf '%s\n' "$tags" | grep '^v[0-9]' | sed 's/^v//' | sort -V | tac || true)" \
                                       "$(printf '%s\n' "$tags" | grep '^e[0-9]' | sort -V | tac || true)" | sed '/^$/d')
        published=
        for v in $candidates; do
          if [ -n "$($SSH "$TARGET" get-state "$v" 2>/dev/null || true)" ]; then
            published="$published $v"
          fi
        done
        $SSH -O exit "$TARGET" 2>/dev/null || true

        keep=$(curl -sS --max-time 20 "${{ env.SITE_ORIGIN }}/versions.json" 2>/dev/null | jq -r ".latest // empty" || true)
        if [ "${{ steps.publish.outcome }}" = "success" ]; then
          latest="${{ steps.ver.outputs.site }}"
        else
          # Ask the site which version /latest actually resolves to. Authoritative,
          # and needs no wrapper verb. Older builds predate the marker, so fall back
          # to whatever the live manifest already recorded rather than guessing.
          served=$(curl -sS --max-time 20 "${{ env.SITE_ORIGIN }}/version.txt?cb=$RANDOM" 2>/dev/null | tr -d "[:space:]" || true)
          case "$served" in [A-Za-z0-9]*) : ;; *) served= ;; esac
          latest="${served:-$keep}"
        fi

        # Which version each channel is on. These org variables are the source of
        # truth the dispatch mechanism already maintains, so the labels cannot drift
        # from what the rest of the build system believes.
        stable="${{ vars.GAME_VERSION_STABLE }}"; stable="${stable#v}"
        beta="${{ vars.GAME_VERSION_BETA }}"; beta="${beta#v}"
        echo "channels: stable=${stable:-none} beta=${beta:-none}"

        # Values go in through --arg: $keep comes back from the live site, and a
        # string spliced into the filter would be parsed as jq syntax.
        for v in $published; do echo "$v"; done | jq -R . \
          | jq -sc --arg latest "$latest" --arg stable "$stable" --arg beta "$beta" \
              '{latest: $latest, stable: $stable, beta: $beta, versions: .}' > versions.json
        cat versions.json
        bash build/rsync-retry.sh -a -e "ssh -p $DOCS_PORT -i ~/.ssh/id_ed25519" versions.json "$TARGET:versions.json"

        # A silent failure here would leave the picker permanently hidden, so
        # confirm the file is actually reachable before calling the run good.
        code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "${{ env.SITE_ORIGIN }}/versions.json?cb=$RANDOM")
        echo "GET /versions.json -> $code"
        [ "$code" = "200" ] || { echo "::error::versions.json was uploaded but is not served ($code)"; exit 1; }
      shell: bash

    - name: Verify
      if: steps.fp.outputs.changed == 'true'
      run: |
        for u in "${{ env.SITE_ORIGIN }}/healthz" "${{ env.SITE_ORIGIN }}/${{ steps.ver.outputs.path }}/index.html"; do
          code=$(curl -s -o /dev/null -w '%{http_code}' -L --max-time 30 "$u")
          echo "  $code  $u"
          [ "$code" = "200" ] || echo "::warning::$u returned $code"
        done
      shell: bash
