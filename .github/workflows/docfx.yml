name: DocFX

on:
  push:
    branches: [ dev ]
    paths:
      - '.github/workflows/docfx.yml'
      - 'build/**'
      - 'docs/**'
  repository_dispatch:
    types: [game_version_update, game_version_update_patch]
  workflow_call:
    inputs:
      game-version:
        required: true
        type: string
      force:
        required: false
        type: boolean
        default: false
      set-latest:
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      game-version:
        description: 'Game version to build, e.g. 1.5.2. Defaults to the stable and beta channels.'
        required: false
        type: string
      force:
        description: 'Rebuild even if nothing has changed since the last deploy'
        required: false
        type: boolean
        default: false
      set-latest:
        description: 'Publish as /latest even when this is not the stable version (needs an explicit game-version)'
        required: false
        type: boolean
        default: false

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  SITE_ORIGIN: https://bannerlordapi.butr.link
  DOCS_PORT: ${{ vars.DOCS_PORT || 22 }}

jobs:
  plan:
    name: Choose versions
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.pick.outputs.versions }}
    steps:
    - name: Pick the versions to build
      id: pick
      # An explicit game-version (workflow_dispatch, or the backfill calling in)
      # builds exactly that. Otherwise both channels are built: the dispatch from
      # the .github repo fires for stable and beta bumps alike, and the beta
      # channel used to be labelled in the manifest but never built.
      #
      # Versions are normalised here (leading v stripped, charset checked) so the
      # per-version concurrency group below sees one spelling. A leading e is
      # kept: e1.5.2 is the early access build, a different game from 1.5.2. The
      # deploy wrapper accepts [A-Za-z0-9][A-Za-z0-9._-]* only; failing here beats
      # failing at the end of a 15 minute build.
      run: |
        norm() {
          v="${1#v}"
          case "$v" in
            "") return 1 ;;
            [!A-Za-z0-9]*) echo "::error::Version '$v' must start with an alphanumeric character" >&2; exit 1 ;;
            *[!A-Za-z0-9._-]*) echo "::error::Version '$v' may only contain A-Za-z0-9 . _ -" >&2; exit 1 ;;
          esac
          echo "$v"
        }
        list=
        if [ -n "${{ inputs.game-version }}" ]; then
          list="$(norm "${{ inputs.game-version }}")"
        else
          stable="$(norm "${{ vars.GAME_VERSION_STABLE }}" || true)"
          beta="$(norm "${{ vars.GAME_VERSION_BETA }}" || true)"
          [ -n "$stable" ] || { echo "::error::No game version given and GAME_VERSION_STABLE is empty"; exit 1; }
          list="$stable"
          [ -n "$beta" ] && [ "$beta" != "$stable" ] && list="$list $beta"
        fi
        json=$(printf '%s\n' $list | jq -R . | jq -sc .)
        echo "versions=$json" >> "$GITHUB_OUTPUT"
        echo "building: $list"
      shell: bash

  docfx:
    name: DocFX ${{ matrix.version }}
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJson(needs.plan.outputs.versions) }}
    concurrency:
      # Per version. A constant group would serialise the backfill matrix and,
      # worse, cancel it: GitHub keeps only one run pending per group, so each
      # newly queued version would evict the one waiting. Different versions
      # write to different /v/<version>/ trees, so they do not conflict.
      group: docfx-deploy-${{ matrix.version }}
      cancel-in-progress: false
    steps:
    - name: DocFX Setup
      uses: butr/actions-docfx-setup@v4
      with:
        github-token: ${{secrets.GITHUB_TOKEN}}

    - name: .NET SDK for the PackageDownloader
      # The setup action installs 8.x; the downloader targets net10.0 and used to
      # build only because the runner image happens to preinstall it.
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Resolve game version
      id: ver
      run: |
        v="${{ matrix.version }}"
        echo "version=$v" >> "$GITHUB_OUTPUT"
        # Paths follow the game's own naming: a release build 1.5.2 is served
        # from v/1.5.2/, the early access build e1.5.2 from e/1.5.2/.
        case "$v" in e*) p="e/${v#e}" ;; *) p="v/$v" ;; esac
        echo "path=$p" >> "$GITHUB_OUTPUT"
        echo "site path: /$p/"
        # /latest is defined as the stable channel, so the publish step keys off
        # this rather than off a default-on input. A manually dispatched old version
        # then cannot repoint the whole site by accident.
        st="${{ vars.GAME_VERSION_STABLE }}"; st="${st#v}"
        [ "$v" = "$st" ] && echo "is-stable=true" >> "$GITHUB_OUTPUT" || echo "is-stable=false" >> "$GITHUB_OUTPUT"
        echo "stable channel: ${st:-unset}"
        echo "Target game version: $v"
      shell: bash

    - name: Check deploy configuration
      env:
        DOCS_SSH_KEY: ${{ secrets.DOCS_SSH_KEY }}
      run: |
        miss=
        [ -n "${{ vars.DOCS_HOST }}" ] || miss="$miss DOCS_HOST"
        [ -n "${{ vars.DOCS_USER }}" ] || miss="$miss DOCS_USER"
        [ -n "$DOCS_SSH_KEY" ] || miss="$miss DOCS_SSH_KEY"
        [ -n "${{ vars.DOCS_KNOWN_HOSTS }}" ] || miss="$miss DOCS_KNOWN_HOSTS"
        if [ -n "$miss" ]; then
          echo "::error::Missing deploy configuration:$miss"
          exit 1
        fi
        echo "deploy target: ${{ vars.DOCS_USER }}@${{ vars.DOCS_HOST }} (port $DOCS_PORT)"
      shell: bash

    - name: Configure SSH
      # The host key is pinned from a variable. ssh-keyscan at run time would be
      # trust-on-first-use on every run, which authenticates nothing.
      env:
        DOCS_SSH_KEY: ${{ secrets.DOCS_SSH_KEY }}
        DOCS_KNOWN_HOSTS: ${{ vars.DOCS_KNOWN_HOSTS }}
      run: |
        install -d -m 700 ~/.ssh
        printf '%s\n' "$DOCS_SSH_KEY" > ~/.ssh/id_ed25519
        chmod 600 ~/.ssh/id_ed25519
        printf '%s\n' "$DOCS_KNOWN_HOSTS" > ~/.ssh/known_hosts
        chmod 644 ~/.ssh/known_hosts
      shell: bash

    - name: Download ref packages
      # Fails if Core has no build for this version; other packages are optional
      # because the module set differs between game versions. Also writes
      # game/api-surface.json, which tells the generator which Server and
      # ModdingKit copies of a client assembly differ from the client build.
      run: >-
        dotnet run --project build/PackageDownloader -c Release --
        -v ${{ steps.ver.outputs.version }}
        -t "$PWD"
      shell: bash

    - name: Generate DocFX config for this version
      # The module set changes between game versions: Multiplayer only exists
      # from 1.2, DedicatedCustomServerHelper disappears after 1.1, FastMode
      # exists only for 1.3 and 1.4. docfx-meta.json, api/toc.yml and index.md
      # are therefore derived from the packages that were actually downloaded,
      # rather than checked in for one version and wrong for the other 49.
      run: >-
        python3 build/generate-docfx-config.py game docs
        --version ${{ steps.ver.outputs.version }}
        --site ${{ env.SITE_ORIGIN }}
      shell: bash

    - name: Decide whether a rebuild is needed
      id: fp
      # A published version is immutable unless one of three things changes: the
      # game shipped a new build under the same x.y.z (a hotfix), the docs or the
      # build tooling changed, or DocFX changed. Otherwise the output reproduces
      # byte for byte. The dispatch from the .github repo fires several times a
      # day, so this is the difference between a few builds a year and a few a day.
      run: |
        V="${{ steps.ver.outputs.version }}"
        SSH="ssh -p $DOCS_PORT -i ~/.ssh/id_ed25519 ${{ vars.DOCS_USER }}@${{ vars.DOCS_HOST }}"
        pkgs=$(find game -mindepth 2 -maxdepth 2 -type d | sed 's|^game/||' | sort | sha256sum | cut -c1-16)
        docs=$(git rev-parse "HEAD:docs")
        build=$(git rev-parse "HEAD:build")
        tool=$(docfx --version 2>/dev/null | head -1 | tr -d ' ')
        fp="pkgs=$pkgs docs=${docs:0:12} build=${build:0:12} docfx=$tool"
        printf '%s' "$fp" > fingerprint.txt
        echo "fp=$fp" >> "$GITHUB_OUTPUT"
        echo "local  : $fp"
        if remote=$($SSH get-state "$V"); then
          echo "remote : ${remote:-<none>}"
        else
          echo "::warning::Could not read the remote state for v$V; treating it as unpublished"
          remote=
        fi
        if [ "${{ inputs.force }}" = "true" ]; then
          echo "changed=true" >> "$GITHUB_OUTPUT"; echo "-> forced rebuild"
        elif [ "$remote" = "$fp" ]; then
          echo "changed=false" >> "$GITHUB_OUTPUT"
          echo "-> v$V is already published from these exact inputs; skipping"
          echo "Skipped: v$V already published from these inputs." >> "$GITHUB_STEP_SUMMARY"
        else
          echo "changed=true" >> "$GITHUB_OUTPUT"; echo "-> rebuilding"
        fi
      shell: bash

    - name: Run DocFX
      if: steps.fp.outputs.changed == 'true'
      # Metadata, then the delta pass, then the build. The Server and ModdingKit
      # sections come out of metadata holding whole copies of client assemblies;
      # apply-api-delta.py cuts them down to the types and members the client
      # sections do not have, so they document only what those builds add.
      run: |
        docfx docs/docfx-meta.json
        # DocFX treats a file list that matches nothing as a warning and exits 0,
        # and the site then ships with an empty API section. Every section in
        # the generated config must have produced a TOC before the build runs.
        for d in $(jq -r '.metadata[].dest' docs/docfx-meta.json); do
          test -s "docs/$d/toc.yml" || { echo "::error::DocFX metadata produced nothing for $d"; exit 1; }
        done
        python3 build/apply-api-delta.py docs
        docfx docs/docfx-build.json
      shell: bash

    - name: Post-process xrefmap
      if: steps.fp.outputs.changed == 'true'
      # baseUrl pins consumers to this exact game version, so a link from
      # ButterLib/MCM keeps resolving after newer versions are published.
      # The dropped fields are never used: Find() binary-searches on uid alone,
      # and fullName/nameWithType are only read for ?displayProperty=.
      run: >-
        sed -i -E
        -e '1a baseUrl: ${{ env.SITE_ORIGIN }}/${{ steps.ver.outputs.path }}/'
        -e '/^  (commentId|fullName|nameWithType): /d'
        docs/_site/xrefmap.yml
      shell: bash

    - name: Stamp version marker
      if: steps.fp.outputs.changed == 'true'
      # Lets anything read back which version /latest resolves to, by fetching
      # /version.txt from the site root. The wrapper exposes no verb for the
      # symlink, and guessing it is how a manifest ends up contradicting what
      # the site actually serves.
      run: echo "${{ steps.ver.outputs.version }}" > docs/_site/version.txt
      shell: bash

    - name: Compress for gzip_static
      if: steps.fp.outputs.changed == 'true'
      # Text assets ship only as .gz; nginx serves them via `gzip_static always`.
      # index.html is the exception -- nginx's index module stats the real file,
      # so a plain copy has to stay for directory requests to resolve.
      # -n omits the filename and mtime from the gzip header, so identical
      # content produces identical bytes between builds.
      run: |
        cd docs/_site
        before=$(du -sb . | cut -f1)
        find . -type f \( -name '*.html' -o -name '*.css' -o -name '*.js' \
             -o -name '*.json' -o -name '*.yml' -o -name '*.svg' -o -name '*.map' \) \
          -print0 | xargs -0 -r -P "$(nproc)" -n 64 gzip -9nk
        find . -type f \( -name '*.html' -o -name '*.css' -o -name '*.js' \
             -o -name '*.json' -o -name '*.yml' -o -name '*.svg' -o -name '*.map' \) \
          ! -name 'index.html' -print0 | xargs -0 -r rm -f
        after=$(du -sb . | cut -f1)
        echo "payload $(numfmt --to=iec $before) -> $(numfmt --to=iec $after)"
        test -f index.html || { echo "::error::index.html was removed; directory requests would 404"; exit 1; }
      shell: bash

    - name: Deploy version
      if: steps.fp.outputs.changed == 'true'
      # Paths are relative because the deploy key is confined by rrsync, which
      # anchors every path to its own root. There is no absolute path to set.
      # rrsync also allows one session at a time per user; the wrapper script
      # waits and retries when another job's upload holds it.
      run: |
        bash build/rsync-retry.sh -a --delete \
          -e "ssh -p $DOCS_PORT -i ~/.ssh/id_ed25519" \
          docs/_site/ "${{ vars.DOCS_USER }}@${{ vars.DOCS_HOST }}:${{ steps.ver.outputs.path }}/"
      shell: bash

    - name: Record build fingerprint
      if: steps.fp.outputs.changed == 'true'
      # Written after the deploy, so a failed build never marks a version current.
      run: |
        V="${{ steps.ver.outputs.version }}"
        ssh -p "$DOCS_PORT" -i ~/.ssh/id_ed25519 \
          "${{ vars.DOCS_USER }}@${{ vars.DOCS_HOST }}" set-state "$V" < fingerprint.txt
      shell: bash

    - name: Publish as latest
      id: publish
      # set-latest is only defined for workflow_dispatch and workflow_call. On
      # push and repository_dispatch it is an empty string, which GitHub coerces
      # to 0 -- the same as false -- so `!= false` would silently skip publishing
      # on exactly the trigger that matters most. It is also only honoured with
      # an explicit game-version: with both channels in the matrix it would
      # otherwise publish whichever finished last. Early access builds are never
      # /latest: the site root is the release line.
      if: >-
        steps.fp.outputs.changed == 'true' &&
        !startsWith(steps.ver.outputs.version, 'e') &&
        (steps.ver.outputs.is-stable == 'true' || (inputs.set-latest && inputs.game-version != ''))
      run: |
        V="${{ steps.ver.outputs.version }}"
        ssh -p "$DOCS_PORT" -i ~/.ssh/id_ed25519 \
          "${{ vars.DOCS_USER }}@${{ vars.DOCS_HOST }}" publish "$V"
        echo "published v$V as latest"
      shell: bash

    - name: Update version manifest
      # The picker reads this at run time, which is what lets a version built
      # today appear in the dropdown of one built two years ago. Rebuilt from
      # server state on every deploy, so it is self-healing: a backfill job that
      # dies before this step, or two parallel jobs racing on the upload, are
      # corrected by the next deploy.
      run: |
        SSH="ssh -p $DOCS_PORT -i ~/.ssh/id_ed25519 -o BatchMode=yes"
        SSH="$SSH -o ControlMaster=auto -o ControlPath=$HOME/.ssh/cm-%r@%h:%p -o ControlPersist=60"
        TARGET="${{ vars.DOCS_USER }}@${{ vars.DOCS_HOST }}"

        # Every version id that exists as a package, newest first: release x.y.z
        # from the Core index, then early access ex.y.z from Core.EarlyAccess.
        list_versions() {
          for pkg in core core.earlyaccess; do
            prefix=; [ "$pkg" = core.earlyaccess ] && prefix=e
            curl -sS --max-time 60 "https://api.nuget.org/v3-flatcontainer/bannerlord.referenceassemblies.$pkg/index.json" \
              | jq -r '.versions[]' | sed 's/-.*//' \
              | awk -F. 'NF>=3 {print $1"."$2"."$3}' | sort -u -V | tac | sed "s/^/$prefix/"
          done
        }

        published=
        for v in $(list_versions); do
          if [ -n "$($SSH "$TARGET" get-state "$v" 2>/dev/null || true)" ]; then
            published="$published $v"
          fi
        done
        $SSH -O exit "$TARGET" 2>/dev/null || true

        keep=$(curl -sS --max-time 20 "${{ env.SITE_ORIGIN }}/versions.json" 2>/dev/null | jq -r ".latest // empty" || true)
        if [ "${{ steps.publish.outcome }}" = "success" ]; then
          latest="${{ steps.ver.outputs.version }}"
        else
          # Ask the site which version /latest actually resolves to. Authoritative,
          # and needs no wrapper verb. Older builds predate the marker, so fall back
          # to whatever the live manifest already recorded rather than guessing.
          served=$(curl -sS --max-time 20 "${{ env.SITE_ORIGIN }}/version.txt?cb=$RANDOM" 2>/dev/null | tr -d "[:space:]" || true)
          case "$served" in [A-Za-z0-9]*) : ;; *) served= ;; esac
          latest="${served:-$keep}"
        fi

        # Which version each channel is on. These org variables are the source of
        # truth the dispatch mechanism already maintains, so the labels cannot drift
        # from what the rest of the build system believes.
        stable="${{ vars.GAME_VERSION_STABLE }}"; stable="${stable#v}"
        beta="${{ vars.GAME_VERSION_BETA }}"; beta="${beta#v}"
        echo "channels: stable=${stable:-none} beta=${beta:-none}"

        # Values go in through --arg: $keep comes back from the live site, and a
        # string spliced into the filter would be parsed as jq syntax.
        for v in $published; do echo "$v"; done | jq -R . \
          | jq -sc --arg latest "$latest" --arg stable "$stable" --arg beta "$beta" \
              '{latest: $latest, stable: $stable, beta: $beta, versions: .}' > versions.json
        cat versions.json
        bash build/rsync-retry.sh -a -e "ssh -p $DOCS_PORT -i ~/.ssh/id_ed25519" versions.json "$TARGET:versions.json"

        # A silent failure here would leave the picker permanently hidden, so
        # confirm the file is actually reachable before calling the run good.
        code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "${{ env.SITE_ORIGIN }}/versions.json?cb=$RANDOM")
        echo "GET /versions.json -> $code"
        [ "$code" = "200" ] || { echo "::error::versions.json was uploaded but is not served ($code)"; exit 1; }
      shell: bash

    - name: Verify
      if: steps.fp.outputs.changed == 'true'
      run: |
        for u in "${{ env.SITE_ORIGIN }}/healthz" "${{ env.SITE_ORIGIN }}/${{ steps.ver.outputs.path }}/index.html"; do
          code=$(curl -s -o /dev/null -w '%{http_code}' -L --max-time 30 "$u")
          echo "  $code  $u"
          [ "$code" = "200" ] || echo "::warning::$u returned $code"
        done
      shell: bash
